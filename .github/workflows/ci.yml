name: genes-ts CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # The selector remains observation-only. This complete current-primary run
    # is the backstop that can reveal an owner the future selected PR lane
    # would have missed.
    - cron: "17 7 * * *"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  # Superseded pull-request runs are disposable. A main run may already have
  # created a version tag, so it must reach its rerunnable publication check.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  YARN_VERSION: "1.22.22"

jobs:
  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
      - name: Review dependency changes
        if: ${{ !github.event.repository.fork }}
        uses: actions/dependency-review-action@v4
      - name: Report fork dependency-review fallback
        if: ${{ github.event.repository.fork }}
        run: |
          echo "::notice title=Dependency review unavailable on GitHub forks::The dependency-review API rejects fork repositories; the required Vulnerabilities (OSV) job still scans the pinned dependency set."
          printf '%s\n' \
            "### Dependency Review" \
            "" \
            "GitHub's dependency-review API is unavailable for fork repositories." \
            "The required **Vulnerabilities (OSV)** job remains the security gate for the pinned dependency set." \
            >> "$GITHUB_STEP_SUMMARY"

  codeql:
    name: Analyze (JavaScript)
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      # CodeQL lives in this workflow so release publication can require the
      # scan result for the exact same main-branch SHA.
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: javascript
      - uses: github/codeql-action/analyze@v4

  beads-worktree-safety:
    name: Beads worktree safety (${{ matrix.beads-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - beads-version: "1.0.4"
            beads-sha256: "643e602e27f666c8726abff0f22001e2b5883988fa960204bde20a3129d448a5"
          - beads-version: "1.1.0"
            beads-sha256: "b0f3dd607c3fb989ee08d0a6854fba80d0402971eb108f9af6170bc14d491a34"
    steps:
      - uses: actions/checkout@v4
      - id: toolchains
        run: node scripts/emit-toolchain-outputs.mjs
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.toolchains.outputs.node-stable }}
          cache: yarn
          cache-dependency-path: yarn.lock
      - run: corepack enable
      - run: corepack prepare yarn@${{ env.YARN_VERSION }} --activate
      - run: yarn install --frozen-lockfile
      - name: Install verified Beads ${{ matrix.beads-version }} release
        env:
          BEADS_VERSION: ${{ matrix.beads-version }}
          BEADS_SHA256: ${{ matrix.beads-sha256 }}
        run: |
          archive="beads_${BEADS_VERSION}_linux_amd64.tar.gz"
          archive_path="${RUNNER_TEMP}/${archive}"
          curl --fail --location --silent --show-error \
            --output "$archive_path" \
            "https://github.com/gastownhall/beads/releases/download/v${BEADS_VERSION}/${archive}"
          printf '%s  %s\n' "$BEADS_SHA256" "$archive_path" | sha256sum --check --strict
          tar -xzf "$archive_path" -C "$RUNNER_TEMP" bd
          sudo install -m 0755 "$RUNNER_TEMP/bd" /usr/local/bin/bd
          bd version
      - name: Install Haxe formatter used by the pre-commit contract
        run: yarn haxelib install formatter 1.18.0 --quiet
      - run: yarn test:beads-worktrees
      - run: yarn test:precommit-hook

  beads-pinned-client:
    name: Beads pinned client
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: toolchains
        run: node scripts/emit-toolchain-outputs.mjs
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.toolchains.outputs.node-stable }}
          cache: yarn
          cache-dependency-path: yarn.lock
      - uses: actions/setup-go@v5
        with:
          # The reviewed Beads source pin declares this toolchain in go.mod.
          go-version: "1.26.5"
          cache: false
      - run: corepack enable
      - run: corepack prepare yarn@${{ env.YARN_VERSION }} --activate
      - run: yarn install --frozen-lockfile
      - run: yarn beads:install
      - run: yarn hooks:install
      - run: yarn test:beads-pin

  secrets:
    name: Secrets (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: toolchains
        run: node scripts/emit-toolchain-outputs.mjs
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.toolchains.outputs.node-stable }}
          cache: yarn
          cache-dependency-path: yarn.lock
      - run: corepack enable
      - run: corepack prepare yarn@${{ env.YARN_VERSION }} --activate
      - run: yarn install --frozen-lockfile
      - run: yarn test:secrets

  vulns:
    name: Vulnerabilities (OSV)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: toolchains
        run: node scripts/emit-toolchain-outputs.mjs
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.toolchains.outputs.node-stable }}
          cache: yarn
          cache-dependency-path: yarn.lock
      - run: corepack enable
      - run: corepack prepare yarn@${{ env.YARN_VERSION }} --activate
      - run: yarn install --frozen-lockfile
      - run: yarn test:vulns

  classic:
    name: Classic Genes (${{ matrix.node-lane }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.allow-failure || false }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node-lane: stable
          - os: ubuntu-latest
            node-lane: nextLts
          - os: macos-latest
            node-lane: stable
            allow-failure: true
    steps:
      - uses: actions/checkout@v4
      - id: toolchains
        run: node scripts/emit-toolchain-outputs.mjs
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-lane == 'stable' && steps.toolchains.outputs.node-stable || steps.toolchains.outputs.node-next-lts }}
          cache: yarn
          cache-dependency-path: yarn.lock
      - run: corepack enable
      - run: corepack prepare yarn@${{ env.YARN_VERSION }} --activate
      - name: Cache Haxe toolchain (lix)
        uses: actions/cache@v4
        with:
          path: |
            ~/haxe
          key: ${{ runner.os }}-lix-haxe-${{ steps.toolchains.outputs.haxe-stable }}-node-${{ matrix.node-lane }}-${{ hashFiles('.haxerc', 'haxe_libraries/*.hxml', 'yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-lix-haxe-${{ steps.toolchains.outputs.haxe-stable }}-node-${{ matrix.node-lane }}-
            ${{ runner.os }}-lix-haxe-${{ steps.toolchains.outputs.haxe-stable }}-
      - run: yarn install --frozen-lockfile
      - run: yarn lix install haxe ${{ steps.toolchains.outputs.haxe-stable }}
      - run: yarn lix use haxe ${{ steps.toolchains.outputs.haxe-stable }}
      - run: yarn test

  genes-test-plan-and-smoke:
    name: Genes test plan + official Haxe inventory/smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: toolchains
        run: node scripts/emit-toolchain-outputs.mjs
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.toolchains.outputs.node-stable }}
          cache: yarn
          cache-dependency-path: yarn.lock
      - run: corepack enable
      - run: corepack prepare yarn@${{ env.YARN_VERSION }} --activate
      - name: Cache Haxe toolchain (lix)
        uses: actions/cache@v4
        with:
          path: ~/haxe
          key: ${{ runner.os }}-lix-haxe-${{ steps.toolchains.outputs.haxe-stable }}-${{ hashFiles('.haxerc', 'haxe_libraries/*.hxml', 'yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-lix-haxe-${{ steps.toolchains.outputs.haxe-stable }}-
      - name: Cache pinned official Haxe smoke source
        uses: actions/cache@v4
        with:
          path: .cache/portable-haxe-smoke
          key: ${{ runner.os }}-portable-haxe-smoke-${{ hashFiles('tests/portable-haxe-smoke/manifest.json') }}
      - name: Cache pinned official Haxe inventory source
        uses: actions/cache@v4
        with:
          path: .cache/official-haxe-inventory
          key: ${{ runner.os }}-official-haxe-inventory-${{ hashFiles('tests/official-haxe-inventory/manifest.json') }}
      - run: yarn install --frozen-lockfile
      - run: yarn lix install haxe ${{ steps.toolchains.outputs.haxe-stable }}
      - run: yarn lix use haxe ${{ steps.toolchains.outputs.haxe-stable }}
      - run: yarn test:test-tool-preparation
      - run: yarn test:ci:explain
      - run: yarn test:agent-test-routing
      - run: yarn test:compatibility-report
      - run: yarn test:official-haxe-inventory
      - run: yarn test:official-haxe-inventory:failures
      - run: yarn test:smoke
      - name: Preserve selection, timings, generated source, and failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: genes-test-plan-and-official-haxe
          path: |
            .tmp/test-evidence/test-plan
            .tmp/official-haxe-inventory
            .tmp/test-evidence/portable-haxe-smoke
            .tmp/test-evidence/portable-haxe-smoke-failures
          if-no-files-found: error

  official-haxe-representative:
    name: Official Haxe representative evidence
    if: github.event_name == 'schedule' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GENES_OFFICIAL_HAXE_EVIDENCE_SCOPE: ${{ github.event_name == 'schedule' && 'scheduled' || 'release' }}
      GENES_OFFICIAL_HAXE_EVIDENCE_ARTIFACT: official-haxe-${{ github.event_name == 'schedule' && 'scheduled' || 'release' }}-${{ github.sha }}-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: toolchains
        run: node scripts/emit-toolchain-outputs.mjs
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.toolchains.outputs.node-stable }}
          cache: yarn
          cache-dependency-path: yarn.lock
      - run: corepack enable
      - run: corepack prepare yarn@${{ env.YARN_VERSION }} --activate
      - name: Cache Haxe toolchain (lix)
        uses: actions/cache@v4
        with:
          path: ~/haxe
          key: ${{ runner.os }}-lix-haxe-${{ steps.toolchains.outputs.haxe-stable }}-${{ hashFiles('.haxerc', 'haxe_libraries/*.hxml', 'yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-lix-haxe-${{ steps.toolchains.outputs.haxe-stable }}-
      - name: Cache pinned representative official Haxe source
        uses: actions/cache@v4
        with:
          path: .cache/official-haxe-representative
          key: ${{ runner.os }}-official-haxe-representative-${{ hashFiles('tests/official-haxe-representative/manifest.json') }}
      - run: yarn install --frozen-lockfile
      - run: yarn lix install haxe ${{ steps.toolchains.outputs.haxe-stable }}
      - run: yarn lix use haxe ${{ steps.toolchains.outputs.haxe-stable }}
      - run: yarn test:official-haxe-representative
      - name: Preserve exact per-profile representative evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.GENES_OFFICIAL_HAXE_EVIDENCE_ARTIFACT }}
          path: .tmp/test-evidence/official-haxe-representative*
          if-no-files-found: error

  genes-ts:
    name: genes-ts (TS output + todoapp E2E)
    needs: genes-test-plan-and-smoke
    # This check is protected by branch rules. It must still report a failure
    # when its preflight fails, because GitHub treats a dependency-skipped
    # required job as successful.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Require the test plan and official Haxe smoke
        if: ${{ needs.genes-test-plan-and-smoke.result != 'success' }}
        run: |
          echo "The test-plan and official-Haxe smoke job did not pass."
          exit 1
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: toolchains
        run: node scripts/emit-toolchain-outputs.mjs
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.toolchains.outputs.node-stable }}
          cache: yarn
          cache-dependency-path: yarn.lock
      - run: corepack enable
      - run: corepack prepare yarn@${{ env.YARN_VERSION }} --activate
      - name: Cache Haxe toolchain (lix)
        uses: actions/cache@v4
        with:
          path: |
            ~/haxe
          key: ${{ runner.os }}-lix-haxe-${{ steps.toolchains.outputs.haxe-stable }}-${{ hashFiles('.haxerc', 'haxe_libraries/*.hxml', 'yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-lix-haxe-${{ steps.toolchains.outputs.haxe-stable }}-
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('yarn.lock') }}
      - run: yarn install --frozen-lockfile
      - name: Pack tooling for its oldest supported Node release
        run: |
          set -euo pipefail
          yarn build:scripts
          yarn --cwd tooling build
          destination="${RUNNER_TEMP}/tooling-minimum-runtime"
          mkdir -p "$destination"
          npm pack ./tooling --json --pack-destination "$destination" \
            > "${RUNNER_TEMP}/tooling-minimum-runtime-pack.json"
          filename="$(node -e '
            const fs = require("node:fs");
            const result = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
            if (!Array.isArray(result) || result.length !== 1 ||
                typeof result[0]?.filename !== "string") process.exit(1);
            process.stdout.write(result[0].filename);
          ' "${RUNNER_TEMP}/tooling-minimum-runtime-pack.json")"
          echo "TOOLING_MINIMUM_TARBALL=${destination}/${filename}" >> "$GITHUB_ENV"
          echo "TOOLING_MINIMUM_PACK_JSON=${RUNNER_TEMP}/tooling-minimum-runtime-pack.json" >> "$GITHUB_ENV"
      - name: Select the tooling package's oldest supported Node release
        uses: actions/setup-node@v4
        with:
          node-version: 26.1.0
      - name: Verify the packed tooling package on Node 26.1
        run: |
          set -euo pipefail
          test "$(node --version)" = "v26.1.0"
          node scripts/dist/test-tooling-package.js \
            --tarball "$TOOLING_MINIMUM_TARBALL" \
            --pack-json "$TOOLING_MINIMUM_PACK_JSON"
      - name: Restore the repository Node release
        uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.toolchains.outputs.node-stable }}
          cache: yarn
          cache-dependency-path: yarn.lock
      - run: corepack enable
      - run: corepack prepare yarn@${{ env.YARN_VERSION }} --activate
      # This job is a required status. Run the structural policy here so a
      # required-check rename or matrix change is rejected on the PR that
      # proposes it, before GitHub settings and workflow output can diverge.
      - run: yarn test:main-protection-policy
      # Release settings live outside Git. Keep their public live-policy check
      # in this required job so a weakened environment blocks ordinary PRs.
      - run: yarn test:tooling-release-workflow
      # The GitHub-only tooling archive has a separate package and tag. Check
      # its source, asset, and no-npm rules in the same required job.
      - run: yarn test:tooling-github-release
      # These non-publishing checks exercise the real SemVer analyzer, exact
      # artifact bytes, and fail-closed recovery before main can publish them.
      - run: yarn test:release
      - run: yarn lix install haxe ${{ steps.toolchains.outputs.haxe-stable }}
      - run: yarn lix use haxe ${{ steps.toolchains.outputs.haxe-stable }}
      # The stdlib-overlay provenance gate formats the authenticated upstream
      # source with this exact version before comparing the reviewed edit.
      - run: yarn haxelib install formatter 1.18.0 --quiet
      # Keep the compiler's own null-safety scope and reviewed escape inventory
      # in a required PR job; the release-only aggregate is too late to catch a
      # policy regression introduced by an ordinary change.
      - run: yarn test:null-safety
      - run: yarn test:acceptance
        env:
          SKIP_CLASSIC: "1"
          SKIP_TS2HX: "1"
      - run: yarn test:ts2hx
      - run: yarn test:matrix:api
      - run: yarn test:template-literals
      - run: yarn test:classic:dts
      - run: yarn test:library-profile

  genes-ts-smoke-next-lts:
    name: genes-ts smoke (Node current / next LTS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: toolchains
        run: node scripts/emit-toolchain-outputs.mjs
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.toolchains.outputs.node-next-lts }}
          cache: yarn
          cache-dependency-path: yarn.lock
      - run: corepack enable
      - run: corepack prepare yarn@${{ env.YARN_VERSION }} --activate
      - name: Cache Haxe toolchain (lix)
        uses: actions/cache@v4
        with:
          path: |
            ~/haxe
          key: ${{ runner.os }}-lix-haxe-${{ steps.toolchains.outputs.haxe-stable }}-node-next-lts-${{ hashFiles('.haxerc', 'haxe_libraries/*.hxml', 'yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-lix-haxe-${{ steps.toolchains.outputs.haxe-stable }}-node-next-lts-
            ${{ runner.os }}-lix-haxe-${{ steps.toolchains.outputs.haxe-stable }}-
      - run: yarn install --frozen-lockfile
      - run: yarn lix install haxe ${{ steps.toolchains.outputs.haxe-stable }}
      - run: yarn lix use haxe ${{ steps.toolchains.outputs.haxe-stable }}
      # Keep the latest-Node smoke on the same authenticated overlay contract.
      - run: yarn haxelib install formatter 1.18.0 --quiet
      - run: yarn test:acceptance
        env:
          SKIP_CLASSIC: "1"
          SKIP_TS2HX: "1"
          SKIP_PLAYWRIGHT: "1"
          SKIP_COMPILER_SERVER: "1"

  haxe-preview:
    name: Haxe preview (non-blocking)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - id: toolchains
        run: node scripts/emit-toolchain-outputs.mjs
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.toolchains.outputs.node-stable }}
          cache: yarn
          cache-dependency-path: yarn.lock
      - run: corepack enable
      - run: corepack prepare yarn@${{ env.YARN_VERSION }} --activate
      - name: Cache Haxe preview toolchain (lix)
        uses: actions/cache@v4
        with:
          path: ~/haxe
          key: ${{ runner.os }}-lix-haxe-${{ steps.toolchains.outputs.haxe-preview }}-${{ hashFiles('haxe_libraries/*.hxml', 'yarn.lock') }}
      - run: yarn install --frozen-lockfile
      - run: yarn lix install haxe ${{ steps.toolchains.outputs.haxe-preview }}
      - run: yarn lix use haxe ${{ steps.toolchains.outputs.haxe-preview }}
      - id: preview-baseline
        name: Run baseline suite against Haxe preview
        continue-on-error: true
        run: yarn test
      - id: preview-minimal
        name: Run minimal generated suite against Haxe preview
        continue-on-error: true
        run: yarn test:genes-ts:minimal
      - id: preview-template-literals
        name: Run template-literal suite against Haxe preview
        continue-on-error: true
        run: yarn test:template-literals
      - id: preview-binding-identity
        name: Run import-origin suite against Haxe preview
        continue-on-error: true
        run: yarn test:binding-identity
      - id: preview-hxx-diagnostic-ranges
        name: Verify HXX diagnostic ranges against Haxe preview
        continue-on-error: true
        run: yarn test:genes-ts:hxx-diagnostic-ranges
      - id: preview-source-jsx
        name: Verify source-preserving JSX against Haxe preview
        continue-on-error: true
        run: yarn test:genes-ts:tsx && yarn test:genes-ts:sourcemaps
      - id: preview-compiler-server
        name: Verify warm compiler-server equivalence against Haxe preview
        continue-on-error: true
        run: yarn test:compiler-server
      - id: preview-compiler-server-rollback
        name: Verify raw-throw rollback against Haxe preview
        continue-on-error: true
        run: yarn test:compiler-server:rollback
      - name: Report Haxe preview compatibility
        if: always()
        env:
          BASELINE_OUTCOME: ${{ steps.preview-baseline.outcome }}
          MINIMAL_OUTCOME: ${{ steps.preview-minimal.outcome }}
          TEMPLATE_LITERALS_OUTCOME: ${{ steps.preview-template-literals.outcome }}
          BINDING_IDENTITY_OUTCOME: ${{ steps.preview-binding-identity.outcome }}
          HXX_DIAGNOSTIC_RANGES_OUTCOME: ${{ steps.preview-hxx-diagnostic-ranges.outcome }}
          SOURCE_JSX_OUTCOME: ${{ steps.preview-source-jsx.outcome }}
          COMPILER_SERVER_OUTCOME: ${{ steps.preview-compiler-server.outcome }}
          COMPILER_SERVER_ROLLBACK_OUTCOME: ${{ steps.preview-compiler-server-rollback.outcome }}
        run: |
          printf '%s\n' \
            "### Haxe preview compatibility (advisory)" \
            "" \
            "- Baseline suite: **$BASELINE_OUTCOME**" \
            "- Minimal generated suite: **$MINIMAL_OUTCOME**" \
            "- Template-literal suite: **$TEMPLATE_LITERALS_OUTCOME**" \
            "- Import-origin suite: **$BINDING_IDENTITY_OUTCOME**" \
            "- HXX diagnostic ranges: **$HXX_DIAGNOSTIC_RANGES_OUTCOME**" \
            "- Source-preserving JSX: **$SOURCE_JSX_OUTCOME**" \
            "- Warm compiler server: **$COMPILER_SERVER_OUTCOME**" \
            "- Raw-throw rollback: **$COMPILER_SERVER_ROLLBACK_OUTCOME**" \
            >> "$GITHUB_STEP_SUMMARY"
          if [ "$BASELINE_OUTCOME" != "success" ] || [ "$MINIMAL_OUTCOME" != "success" ] || [ "$TEMPLATE_LITERALS_OUTCOME" != "success" ] || [ "$BINDING_IDENTITY_OUTCOME" != "success" ] || [ "$HXX_DIAGNOSTIC_RANGES_OUTCOME" != "success" ] || [ "$SOURCE_JSX_OUTCOME" != "success" ] || [ "$COMPILER_SERVER_OUTCOME" != "success" ] || [ "$COMPILER_SERVER_ROLLBACK_OUTCOME" != "success" ]; then
            echo "::warning title=Haxe preview compatibility::baseline=$BASELINE_OUTCOME, minimal=$MINIMAL_OUTCOME, template-literals=$TEMPLATE_LITERALS_OUTCOME, import-origin=$BINDING_IDENTITY_OUTCOME, hxx-diagnostic-ranges=$HXX_DIAGNOSTIC_RANGES_OUTCOME, source-jsx=$SOURCE_JSX_OUTCOME, compiler-server=$COMPILER_SERVER_OUTCOME, compiler-server-rollback=$COMPILER_SERVER_ROLLBACK_OUTCOME. Supported Haxe remains authoritative."
          fi

  release:
    name: Release exact CI-tested commit
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      - beads-worktree-safety
      - beads-pinned-client
      - codeql
      - genes-test-plan-and-smoke
      - official-haxe-representative
      - secrets
      - vulns
      - classic
      - genes-ts
      - genes-ts-smoke-next-lts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    concurrency:
      group: release-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - name: Checkout exact tested commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - id: toolchains
        run: node scripts/emit-toolchain-outputs.mjs
      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ steps.toolchains.outputs.node-stable }}
      - run: corepack enable
      - run: corepack prepare yarn@${{ env.YARN_VERSION }} --activate
      - name: Install exact release dependency graph
        run: yarn install --frozen-lockfile
      - name: Guard reachable SemVer baseline
        run: |
          set -euo pipefail
          semver_tags="$(git tag --merged HEAD | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' || true)"
          if [ -z "$semver_tags" ]; then
            echo "::error::No SemVer tag is reachable from current main history."
            echo "::error::semantic-release would treat this as an initial release."
            exit 1
          fi
          echo "[release] Reachable SemVer tags (latest 5):"
          echo "$semver_tags" | sort -V | tail -n 5
      # GITHUB_TOKEN intentionally has only contents:write. GitHub's settings
      # APIs require Administration:read, which workflows cannot request.
      # Maintainers audit those controls separately; the publisher still fails
      # unless the authoritative final Release reports immutable=true.
      - name: Release or complete the exact tested commit
        id: semantic_release
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          mapfile -t tags_before < <(git tag --points-at HEAD --list 'v[0-9]*.[0-9]*.[0-9]*' | sort -V)
          if (( ${#tags_before[@]} > 1 )); then
            echo "::error::Tested HEAD has multiple semantic-version tags: ${tags_before[*]}"
            exit 1
          fi

          set +e
          npx semantic-release
          semantic_status=$?
          set -e

          mapfile -t tags_after < <(git tag --points-at HEAD --list 'v[0-9]*.[0-9]*.[0-9]*' | sort -V)
          if (( ${#tags_after[@]} > 1 )); then
            echo "::error::Tested HEAD has multiple semantic-version tags: ${tags_after[*]}"
            exit 1
          fi

          if (( ${#tags_after[@]} == 1 )); then
            tag="${tags_after[0]}"
            if (( semantic_status != 0 )) || (( ${#tags_before[@]} == 1 )); then
              echo "[release] Completing or verifying exact tag $tag"
              node scripts/release/complete-release.cjs "$tag"
            fi
          elif (( semantic_status != 0 )); then
            echo "::error::semantic-release failed before creating an exact tag at tested HEAD"
            exit "$semantic_status"
          fi
