# OSV-Scanner configuration for genes-ts.
#
# Keep exceptions narrow and time-bounded. Prefer upgrading dependencies over
# ignoring vulnerabilities.

[[PackageOverrides]]
name = "lix"
ecosystem = "npm"
vulnerability.ignore = true
effectiveUntil = 2026-04-30
reason = "lix is required for Haxe toolchain management in this repo. GHSA-q8xg-8xwf-m598 reports a MITM risk due to accepting http + redirects; upstream currently provides no fixed version. Keep this exception time-bounded and revisit regularly."

[[PackageOverrides]]
name = "npm"
ecosystem = "npm"
vulnerability.ignore = true
effectiveUntil = 2026-03-31
reason = "Pulled in transitively via semantic-release (semantic-release -> @semantic-release/npm -> npm). We do not publish to npm and do not execute the npm CLI as part of our test pipeline; this package is only present in the devDependency tree and is scanned in CI via `yarn test:vulns`. OSV currently reports no fixed version for the flagged advisory (CVE-2026-0775), so we allowlist it temporarily while monitoring for upstream updates."

[[IgnoredVulns]]
id = "GHSA-fc5q-39xc-vjpf"
ignoreUntil = 2026-12-17
reason = "picomatch ReDoS through single-branch repeated extglob patterns such as +(*) (CVE-2026-112366). Every picomatch release through the latest, 4.0.7, is affected and none is fixed yet. picomatch 4.0.4 is only in release and native-build tooling: semantic-release and @semantic-release/commit-analyzer -> micromatch -> picomatch; @semantic-release/github and npm -> @npmcli/run-script -> node-gyp -> tinyglobby (and fdir) -> picomatch. genes-ts has no runtime dependencies and ships none of these packages. The only glob patterns they compile come from this repository (release.config.cjs: branch 'main', scope 'tooling', two fixed asset paths) and contain no extglob, so no untrusted pattern reaches the vulnerable parser. Upgrade the picomatch resolution and remove this entry when a fixed release exists."
